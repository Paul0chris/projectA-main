{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Staff Dashboard | ECU Scavenger Hunt</title>

    <link
        rel="stylesheet"
        href="{% static 'style_css/style.css' %}"
    >
</head>

<body>
    <main class="container">
        <h1>Welcome Staff</h1>

        <div class="accent-line"></div>

        {% if messages %}
            {% for message in messages %}
                <p class="message {{ message.tags }}">
                    {{ message }}
                </p>
            {% endfor %}
        {% endif %}

        <h2>Welcome, {{ user.username }}</h2>

        <p class="welcome-text">
            You are logged in as a staff member.
        </p>

        <form
            method="post"
            action="{% url 'staff_logout' %}"
        >
            {% csrf_token %}

            <button type="submit" class="logout-button">
                Logout
            </button>
        </form>
    </main>
</body>
</html>
